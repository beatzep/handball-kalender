name: Spielplan aktualisieren

on:
  schedule:
    # Werktags nachts einmal.
    - cron: "17 3 * * *"
    # Am Wochenende stuendlich von 14 bis 0 Uhr deutscher Zeit: Anwuerfe um
    # 20 Uhr sind in der Liga ueblich, das Spiel endet gegen 21:45 und der
    # Verband traegt das Ergebnis erst danach ein.
    - cron: "5 12-22 * * 6,0"
  workflow_dispatch:        # erlaubt den Handstart ueber den Actions-Tab

permissions:
  contents: write           # ohne das scheitert der Commit unten mit 403

concurrency:
  group: spielplan
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spielplaene holen und Kalender erzeugen
        run: |
          python3 spielplan2ics.py \
            --teams teams.json \
            --out-dir docs \
            --daten docs/daten.json \
            --keine-schiris | tee "$RUNNER_TEMP/lauf.log"

      - name: Kalenderdateien pruefen
        run: |
          for datei in docs/*.ics; do
            python3 pruefe_ics.py "$datei"
          done

      - name: Seite bauen
        run: |
          python3 baue_seite.py \
            --daten docs/daten.json \
            --basis-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --worker-url "https://muru-zaehler.edis-herrmann.workers.dev" \
            --out docs/index.html

      # Nach dem Seitenbau, damit die eben erzeugte Seite geprueft wird -
      # nicht die vom Vortag.
      - name: Daten und Seite pruefen
        run: python3 audit.py

      - name: Zusammenfassung schreiben
        run: |
          {
            echo "## Lauf vom $(date -u '+%d.%m.%Y %H:%M') UTC"
            echo '```'
            cat "$RUNNER_TEMP/lauf.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis committen
        run: |
          git config user.name "spielplan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Keine Aenderungen - nichts zu committen."
            exit 0
          fi
          # Die Aenderung steht in der Commit-Nachricht: wer das Repo auf
          # "Watch" hat, bekommt Verlegungen so per Benachrichtigung mit.
          python3 commit_text.py --daten docs/daten.json > "$RUNNER_TEMP/commit.txt"
          cat "$RUNNER_TEMP/commit.txt"
          git commit -F "$RUNNER_TEMP/commit.txt"
          git push
