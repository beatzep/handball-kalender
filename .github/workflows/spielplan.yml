name: Spielplan aktualisieren

on:
  schedule:
    # Werktags nachts einmal. Am Wochenende stuendlich zwischen 14 und 22 Uhr,
    # damit Ergebnisse kurz nach Abpfiff auf der Seite stehen.
    - cron: "17 3 * * *"
    - cron: "5 12-20 * * 6,0"
  workflow_dispatch:        # erlaubt den Handstart ueber den Actions-Tab

permissions:
  contents: write           # ohne das scheitert der Commit unten mit 403

concurrency:
  group: spielplan
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spielplaene holen und Kalender erzeugen
        run: |
          python3 spielplan2ics.py \
            --teams teams.json \
            --out-dir docs \
            --daten docs/daten.json \
            --keine-schiris | tee "$RUNNER_TEMP/lauf.log"

      - name: Kalenderdateien pruefen
        run: |
          for datei in docs/*.ics; do
            python3 pruefe_ics.py "$datei"
          done

      - name: Seite bauen
        run: |
          python3 baue_seite.py \
            --daten docs/daten.json \
            --basis-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --out docs/index.html

      - name: Zusammenfassung schreiben
        run: |
          {
            echo "## Lauf vom $(date -u '+%d.%m.%Y %H:%M') UTC"
            echo '```'
            cat "$RUNNER_TEMP/lauf.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis committen
        run: |
          git config user.name "spielplan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Keine Aenderungen - nichts zu committen."
            exit 0
          fi
          # Die Aenderung steht in der Commit-Nachricht: wer das Repo auf
          # "Watch" hat, bekommt Verlegungen so per Benachrichtigung mit.
          python3 commit_text.py --daten docs/daten.json > "$RUNNER_TEMP/commit.txt"
          cat "$RUNNER_TEMP/commit.txt"
          git commit -F "$RUNNER_TEMP/commit.txt"
          git push
