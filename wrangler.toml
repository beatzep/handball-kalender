name = "muru-zaehler"
main = "worker/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# KV-Speicher fuer Hype- und Anwesenheitszaehler
[[kv_namespaces]]
binding = "ZAEHLER"
id = "9cdf5b8b1e044059909e7af519b2802a"

# Sicherheitsnetz, falls GitHub seine geplanten Laeufe verschiebt oder
# ausfallen laesst. Der Worker stoesst den Workflow nur an, wenn die
# veroeffentlichten Daten aelter als 50 Minuten sind.
[triggers]
crons = ["5 12-22 * * 6,0", "17 3 * * *"]
