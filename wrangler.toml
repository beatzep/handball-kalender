name = "muru-zaehler"
main = "worker/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# KV-Speicher fuer Hype- und Anwesenheitszaehler
[[kv_namespaces]]
binding = "ZAEHLER"
id = "9cdf5b8b1e044059909e7af519b2802a"

# Sicherheitsnetz, falls GitHub seine geplanten Laeufe verschiebt oder
# ausfallen laesst. Der Worker stoesst den Workflow nur an, wenn die
# veroeffentlichten Daten aelter als 50 Minuten sind.
[triggers]
# Cloudflare weist "6,0" als ungueltig ab - anders als GitHub zaehlt sein
# Parser den Sonntag nicht als 0. Mit den Kuerzeln ist es ohnehin lesbarer.
# Am Wochenende alle 15 Minuten nachschauen. Das Nachschauen selbst kostet
# nichts - angestossen wird nur, wenn die Daten wirklich veraltet sind.
crons = ["*/15 12-22 * * SAT,SUN", "17 3 * * *"]
