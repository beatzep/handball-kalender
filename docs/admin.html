<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auswertung – HSG MuRu Spielplan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14140f">
<link rel="icon" href="icon-32.png" sizes="32x32">
<style>
:root {
  --gold: #dd9933; --gold-tief: #b87a22; --gold-schwach: rgba(221,153,51,.10);
  --tinte: #14140f; --tinte-weich: #4a4a42; --leise: #7a776d;
  --linie: #dedbd3; --linie-zart: #ebe9e3;
  --grund: #ffffff; --schwarz: #14140f; --auf-schwarz: #f7f5f0;
  --sieg: #2f7d4f; --niederlage: #a4443a;
}
/* Dunkle Farben an drei Stellen: nach Systemeinstellung (solange niemand
   ausdruecklich hell gewaehlt hat) und bei ausdruecklicher Wahl. */
@media (prefers-color-scheme: dark) {
  :root:not([data-ansicht="hell"]) {
    --gold: #e8ac52; --gold-tief: #dd9933; --gold-schwach: rgba(232,172,82,.12);
    --tinte: #f2efe8; --tinte-weich: #b8b4a9; --leise: #8c877c;
    --linie: #33312b; --linie-zart: #24221e;
    --grund: #0d0d0b; --schwarz: #000000; --auf-schwarz: #f2efe8;
    --sieg: #5cbf85; --niederlage: #e08076;
  }
}
:root[data-ansicht="dunkel"] {
  --gold: #e8ac52; --gold-tief: #dd9933; --gold-schwach: rgba(232,172,82,.12);
  --tinte: #f2efe8; --tinte-weich: #b8b4a9; --leise: #8c877c;
  --linie: #33312b; --linie-zart: #24221e;
  --grund: #0d0d0b; --schwarz: #000000; --auf-schwarz: #f2efe8;
  --sieg: #5cbf85; --niederlage: #e08076;
}

/* ---------- Umschalter hell/dunkel ---------- */
.kopf .huelle { position: relative; }
#ansicht {
  position: absolute; top: 22px; right: 18px;
  width: 42px; height: 42px; padding: 0; cursor: pointer;
  background: transparent; border: 1px solid rgba(247,245,240,.28);
  color: rgba(247,245,240,.8); display: flex; align-items: center;
  justify-content: center;
}
#ansicht:hover { color: var(--gold); border-color: var(--gold); }
#ansicht:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#ansicht svg { width: 20px; height: 20px; display: block; }
/* Gezeigt wird, was beim Tippen passiert: im Hellen der Mond, im Dunklen die Sonne. */
#ansicht .sonne { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-ansicht="hell"]) #ansicht .sonne { display: block; }
  :root:not([data-ansicht="hell"]) #ansicht .mond { display: none; }
}
:root[data-ansicht="dunkel"] #ansicht .sonne { display: block; }
:root[data-ansicht="dunkel"] #ansicht .mond { display: none; }
:root[data-ansicht="hell"] #ansicht .sonne { display: none; }
:root[data-ansicht="hell"] #ansicht .mond { display: block; }
*, *::before, *::after { box-sizing: border-box; border-radius: 0; }

/* Ohne touch-action deutet das Handy zwei schnelle Tipps auf denselben
   Knopf als Doppeltipp und zoomt - beim Hype-Zaehler klickt man aber
   absichtlich schnell hintereinander. */
button, .knopf, select, a.knopf {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--grund); color: var(--tinte);
  font: 400 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
.huelle { max-width: 720px; margin: 0 auto; padding: 0 22px; }
a { color: inherit; }
[hidden] { display: none !important; }

/* ---------- Kopf ---------- */
.kopf { background: var(--schwarz); color: var(--auf-schwarz);
        border-bottom: 2px solid var(--gold); }
.kopf .huelle { padding: 26px 22px 30px; }
.marke { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
.marke img { width: 54px; height: auto; display: block; }
.marke .zeile1 { font-size: .82rem; font-weight: 600; letter-spacing: .04em;
                 color: var(--gold); line-height: 1.3; }
.marke .zeile2 { font-size: .78rem; color: rgba(247,245,240,.55); line-height: 1.3; }
.kopf h1 { margin: 0; font-size: clamp(2.1rem, 11vw, 3.2rem); font-weight: 300;
           line-height: 1.04; letter-spacing: -.015em; }
.kopf .saison { margin: 12px 0 0; font-size: .92rem; color: rgba(247,245,240,.62); }

/* ---------- Mannschaftswahl ---------- */
.wahl { margin: 24px 0 0; }
.wahl label { display: block; font-size: .74rem; font-weight: 600;
              letter-spacing: .08em; text-transform: uppercase;
              color: rgba(247,245,240,.5); margin-bottom: 8px; }
.wahl select {
  appearance: none; -webkit-appearance: none; width: 100%;
  font: inherit; font-size: 1.05rem; font-weight: 600;
  color: var(--auf-schwarz); background: transparent;
  border: 1px solid rgba(247,245,240,.28); padding: 13px 44px 13px 14px;
  background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%),
                    linear-gradient(135deg, var(--gold) 50%, transparent 50%);
  background-position: calc(100% - 21px) 22px, calc(100% - 15px) 22px;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}
.wahl select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wahl select option { color: #14140f; background: #fff; }
.wahl select optgroup { color: #14140f; background: #fff; font-weight: 600; }
.wahlknoepfe { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
#anheften, #zumeinen {
  font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer;
  padding: 9px 14px; background: transparent;
  color: rgba(247,245,240,.72); border: 1px solid rgba(247,245,240,.28);
}
/* Kein Stern: der gehoert zum Anheften und waere daneben verwirrend. */
#zumeinen::before { content: "‹  "; color: var(--gold); }
#zumeinen:hover { color: var(--auf-schwarz); border-color: rgba(247,245,240,.5); }
#zumeinen:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#anheften::before { content: "☆  "; }
#anheften[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
#anheften[aria-pressed="true"]::before { content: "★  "; }
#anheften:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.uebersichtlink { margin: 14px 0 0; font-size: .9rem; }
.uebersichtlink a { color: var(--gold); text-decoration: none; font-weight: 600; }
.uebersichtlink a:hover { color: var(--auf-schwarz); }

/* ---------- Abschnitte ---------- */
.liga { margin: 28px 0 0; font-size: .88rem; font-weight: 600;
        letter-spacing: .04em; color: var(--gold-tief); }
.teil { padding: 34px 0 0; }
.rubrik { border-top: 1px solid var(--linie); padding-top: 14px; margin-bottom: 24px;
          font-size: .95rem; font-weight: 600; color: var(--leise); }

/* ---------- Nächstes Spiel ---------- */
.marker { font-size: .82rem; font-weight: 600; color: var(--gold-tief);
          letter-spacing: .04em; margin: 22px 0 10px; }
.paarung { font-size: clamp(1.5rem, 7vw, 2rem); font-weight: 400; line-height: 1.16;
           letter-spacing: -.01em; margin: 0 0 22px; overflow-wrap: anywhere; }
.fakten { margin: 0; }
.fakten > div { display: flex; gap: 18px; padding: 11px 0;
                border-top: 1px solid var(--linie-zart); font-size: .95rem; }
.fakten dt { flex: 0 0 78px; color: var(--leise); }
.fakten dd { margin: 0; flex: 1; }
.fakten a { color: inherit; text-decoration: none;
            box-shadow: inset 0 -1px 0 var(--gold); }

/* ---------- Reiter ---------- */
.reiter { position: sticky; top: 0; z-index: 5; background: var(--grund);
          border-bottom: 1px solid var(--linie); display: flex;
          overflow-x: auto; scrollbar-width: none; margin-top: 32px; }
.reiter::-webkit-scrollbar { display: none; }
.reiter button {
  flex: 0 0 auto; font: inherit; font-size: .92rem; font-weight: 500;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--leise); padding: 15px 18px 13px; margin-bottom: -1px;
  white-space: nowrap; cursor: pointer;
}
.reiter button:first-child { padding-left: 0; }
.reiter button[aria-selected="true"] { color: var(--tinte); border-bottom-color: var(--gold); }
.reiter button:focus-visible { outline: 2px solid var(--gold-tief); outline-offset: -4px; }

/* ---------- Abo-Wege ---------- */
.weg { padding: 26px 0; border-top: 1px solid var(--linie-zart); }
.rubrik + .weg { border-top: 0; padding-top: 0; }
.weg h3 { margin: 0 0 6px; font-size: 1.12rem; font-weight: 600; }
.weg p { margin: 0 0 18px; font-size: .95rem; color: var(--tinte-weich); }
.knopf {
  display: block; width: 100%; text-align: center; text-decoration: none;
  font: inherit; font-size: 1rem; font-weight: 600; padding: 16px 20px;
  border: 1px solid var(--gold); background: var(--gold); color: #14140f;
  cursor: pointer; transition: background .15s ease;
}
.knopf:hover { background: var(--gold-tief); border-color: var(--gold-tief); }
.knopf.stumm { background: transparent; color: var(--tinte); border-color: var(--tinte); }
.knopf.stumm:hover { background: var(--gold-schwach); border-color: var(--gold); }
.knopf:focus-visible { outline: 2px solid var(--gold-tief); outline-offset: 3px; }
.schritte { margin: 18px 0 0; padding: 0; list-style: none; font-size: .92rem;
            color: var(--tinte-weich); counter-reset: schritt; }
.schritte li { counter-increment: schritt; position: relative;
               padding: 8px 0 8px 34px; border-top: 1px solid var(--linie-zart); }
.schritte li::before { content: counter(schritt); position: absolute; left: 0; top: 8px;
                       font-size: .82rem; font-weight: 600; color: var(--gold-tief); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }

/* ---------- Änderungen ---------- */
.hinweis { border-left: 2px solid var(--gold); padding: 4px 0 4px 18px; margin: 26px 0 0; }
.hinweis h3 { margin: 0 0 8px; font-size: .82rem; font-weight: 600;
              letter-spacing: .04em; color: var(--gold-tief); }
.hinweis ul { margin: 0 0 14px; padding-left: 18px; font-size: .95rem; }
.hinweis li { margin: 5px 0; }
.hinweis button { font: inherit; font-size: .88rem; font-weight: 600;
                  background: none; border: 1px solid var(--linie);
                  color: var(--tinte); padding: 9px 16px; cursor: pointer; }
.hinweis button:hover { border-color: var(--gold); background: var(--gold-schwach); }

/* ---------- Spielplan ---------- */
.monat { font-size: .82rem; font-weight: 600; letter-spacing: .06em;
         text-transform: uppercase; color: var(--leise); padding: 28px 0 10px; }
.monat:first-child { padding-top: 4px; }
.spiel { display: grid; grid-template-columns: 58px 1fr auto; gap: 0 14px;
         align-items: start; padding: 15px 0; border-top: 1px solid var(--linie); }
.spiel .datum { font-size: .88rem; font-weight: 600; line-height: 1.3; }
.spiel .datum span { display: block; font-weight: 400; color: var(--leise); }
.spiel .gegner { font-size: 1.02rem; font-weight: 500; line-height: 1.3;
                 overflow-wrap: anywhere; }
.spiel .halle { font-size: .88rem; color: var(--leise); margin-top: 3px; }
.spiel .halle a { text-decoration: none; box-shadow: inset 0 -1px 0 var(--linie); }
.spiel .halle a:hover { box-shadow: inset 0 -1px 0 var(--gold); }
.rechts { text-align: right; min-width: 46px; }
.hz { font-size: .78rem; font-weight: 600; color: var(--leise); }
.hz.heim { color: var(--gold-tief); }
.stand { font-size: .95rem; font-weight: 700; margin-top: 2px; white-space: nowrap; }
.stand.S { color: var(--sieg); }
.stand.N { color: var(--niederlage); }
.spiel.vorbei { opacity: .55; }
.spiel.vorbei .gegner { font-weight: 400; }
.spiel.jetzt { border-top-color: var(--gold); box-shadow: inset 0 2px 0 var(--gold); }

/* ---------- Form und Verlauf ---------- */
.form { display: flex; align-items: baseline; gap: 10px; margin-bottom: 26px;
        flex-wrap: wrap; }
.form .titel { font-size: .74rem; font-weight: 600; letter-spacing: .06em;
               text-transform: uppercase; color: var(--leise); }
.form .kette { display: flex; gap: 5px; }
.form b { width: 25px; height: 25px; line-height: 25px; text-align: center;
          font-size: .76rem; font-weight: 700; border: 1px solid; }
.form b.S { color: var(--sieg); border-color: var(--sieg); }
.form b.N { color: var(--niederlage); border-color: var(--niederlage); }
.form b.U { color: var(--leise); border-color: var(--linie); }

.verlauf { margin: 0 0 30px; }
.verlauf .titel { font-size: .74rem; font-weight: 600; letter-spacing: .06em;
                  text-transform: uppercase; color: var(--leise);
                  margin-bottom: 12px; }
.verlauf svg { width: 100%; height: auto; display: block; overflow: visible; }
.verlauf .gitter { stroke: var(--linie-zart); stroke-width: 1; }
.verlauf .linie { fill: none; stroke: var(--gold); stroke-width: 2;
                  stroke-linejoin: round; stroke-linecap: round; }
.verlauf .punkt { fill: var(--gold); }
.verlauf text { fill: var(--leise); font-size: 11px;
                font-family: inherit; font-variant-numeric: tabular-nums; }
.verlauf .jetzt { fill: var(--tinte); font-weight: 700; }






/* ---------- Tipprunde ---------- */
.tippspiel { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--linie); }
.tippspiel .titel { font-size: .74rem; font-weight: 600; letter-spacing: .06em;
                    text-transform: uppercase; color: var(--leise); margin-bottom: 14px; }
.tippzeile { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px;
             align-items: end; margin-bottom: 14px; }
.tippzeile label { display: block; font-size: .82rem; color: var(--tinte-weich);
                   margin-bottom: 6px; line-height: 1.3; overflow-wrap: anywhere; }
.tippzeile .doppel { align-self: center; padding-bottom: 12px; color: var(--leise);
                     font-size: 1.2rem; }
.tippspiel input {
  font: inherit; font-size: 1.4rem; font-weight: 600; text-align: center;
  width: 100%; padding: 12px 6px; background: transparent; color: var(--tinte);
  border: 1px solid var(--linie); font-variant-numeric: tabular-nums;
}
.tippspiel input:focus-visible { outline: 2px solid var(--gold-tief); outline-offset: 1px; }
.tippspiel input.name { font-size: 1rem; font-weight: 400; text-align: left;
                        padding: 12px 14px; margin-bottom: 12px; }
.tippspiel .meldung { margin: 10px 0 0; font-size: .88rem; color: var(--tinte-weich); }
.tippspiel .meldung.gut { color: var(--sieg); }
.tippspiel .meldung.schlecht { color: var(--niederlage); }
.tipptabelle { margin-top: 22px; }
.tipptabelle table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tipptabelle td { padding: 9px 0; border-bottom: 1px solid var(--linie-zart); }
.tipptabelle td.pl { color: var(--leise); width: 26px; font-size: .86rem; }
.tipptabelle td.pkt { text-align: right; font-weight: 600; }
.tipptabelle tr.ich td { background: var(--gold-schwach); font-weight: 600; }
.tipptabelle tr.ich td.pl { box-shadow: inset 2px 0 0 var(--gold); }
.tippspiel .nebensache { margin-top: 14px; }
.tippspiel .nebensache button {
  font: inherit; font-size: .84rem; background: none; border: 0; padding: 0;
  color: var(--leise); text-decoration: underline; cursor: pointer;
}
.tippspiel .nebensache button:hover { color: var(--gold-tief); }

/* ---------- Teilen ---------- */
.teilen { margin-top: 34px; }
.formatwahl { display: flex; gap: 0; margin-bottom: 16px; }
.formatwahl button {
  font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer;
  background: transparent; color: var(--leise);
  border: 1px solid var(--linie); padding: 10px 16px; margin-right: -1px;
}
.formatwahl button[aria-pressed="true"] {
  color: var(--tinte); border-color: var(--tinte); position: relative; z-index: 1;
}
.formatwahl button:focus-visible { outline: 2px solid var(--gold-tief); outline-offset: 2px; }
.teilen .knopf { margin-bottom: 10px; }

/* ---------- Statistik ---------- */
.kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 18px;
              margin: 0 0 8px; }
.kennzahlen > div { min-width: 0; }
.kennzahlen dt { font-size: .72rem; font-weight: 600; letter-spacing: .05em;
                 text-transform: uppercase; color: var(--leise); }
.kennzahlen dd { margin: 4px 0 0; font-size: 1.7rem; font-weight: 300;
                 line-height: 1.05; letter-spacing: -.02em; }
.kennzahlen dd .klein { font-size: .95rem; color: var(--leise); font-weight: 400; }
.kennzahlen .zusatz { display: block; margin-top: 4px; font-size: .82rem;
                      color: var(--leise); line-height: 1.35; }
.kennzahlen .breit { grid-column: 1 / -1; }

.verbrauch { margin: 26px 0 0; padding: 22px 0; border-top: 1px solid var(--linie);
             border-bottom: 1px solid var(--linie); }
.verbrauch .wert { font-size: 2.6rem; font-weight: 300; line-height: 1;
                   letter-spacing: -.03em; color: var(--gold-tief); }
.verbrauch .einheit { font-size: 1rem; color: var(--leise); margin-left: 6px; }
.verbrauch .rechnung { margin: 14px 0 0; font-size: .86rem; color: var(--tinte-weich);
                       line-height: 1.5; }
.verbrauch .pointe { margin: 8px 0 0; font-size: .86rem; color: var(--leise);
                     font-style: italic; }

.statfuss { margin: 18px 0 0; font-size: .8rem; color: var(--leise); line-height: 1.45; }

/* ---------- Countdown, Hinspiel, Gegner ---------- */
.countdown {
  font-size: 1.05rem; font-weight: 600; color: var(--tinte);
  margin: 0 0 20px; font-variant-numeric: tabular-nums;
}
.countdown .einheit { color: var(--leise); font-weight: 400; font-size: .92rem; }

.vorschau { margin: 26px 0 0; padding-top: 22px; border-top: 1px solid var(--linie-zart); }
.vorschau h3 {
  margin: 0 0 12px; font-size: .74rem; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--leise);
}
.hinspiel { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
            margin-bottom: 18px; }
.hinspiel .stand { font-size: 1.15rem; font-weight: 700; }
.hinspiel .wo { font-size: .9rem; color: var(--leise); }
.hinspiel a { font-size: .88rem; color: var(--gold-tief); text-decoration: none;
              box-shadow: inset 0 -1px 0 var(--gold); }
.hinspiel a:hover { color: var(--tinte); }

.gegnerdaten { display: flex; gap: 24px; flex-wrap: wrap; margin: 0; }
.gegnerdaten div { margin: 0; }
.gegnerdaten dt { font-size: .74rem; color: var(--leise); letter-spacing: .04em;
                  text-transform: uppercase; }
.gegnerdaten dd { margin: 2px 0 0; font-size: 1.05rem; font-weight: 600; }

/* ---------- Hype und Zusagen ---------- */
.mitmachen { margin: 30px 0 0; padding: 22px 0 0; border-top: 1px solid var(--linie); }
.hype .titel, .dabei .titel {
  font-size: .74rem; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--leise); margin-bottom: 10px;
}
.hype .zahl {
  font-size: 2.4rem; font-weight: 300; line-height: 1; letter-spacing: -.02em;
  color: var(--gold-tief);
}
.hype .vergleich { font-size: .86rem; color: var(--leise); margin-left: 10px; }
.hype .knoepfe { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.hype .knoepfe button {
  font-size: 1.5rem; line-height: 1; background: none; cursor: pointer;
  border: 1px solid var(--linie); padding: 10px 0; width: 58px; height: 52px;
  transition: border-color .12s ease, transform .08s ease;
}
.hype .knoepfe button:hover { border-color: var(--gold); }
.hype .knoepfe button:active { transform: scale(.92); border-color: var(--gold); }
.hype .knoepfe button:focus-visible { outline: 2px solid var(--gold-tief); outline-offset: 2px; }
.hype .bahn { position: relative; height: 0; }
.hype .flug {
  position: absolute; font-size: 1.5rem; pointer-events: none;
  animation: aufsteigen 1s ease-out forwards;
}
@keyframes aufsteigen {
  from { transform: translateY(0) scale(1); opacity: .9; }
  to   { transform: translateY(-70px) scale(1.5); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .hype .flug { animation-duration: .01ms; }
  .hype .knoepfe button:active { transform: none; }
}

.dabei { margin-top: 28px; }
.dabei .reihe { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.dabei button {
  font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer;
  background: transparent; color: var(--tinte);
  border: 1px solid var(--tinte); padding: 12px 20px;
}
.dabei button:hover { border-color: var(--gold); background: var(--gold-schwach); }
.dabei button[aria-pressed="true"] {
  background: var(--gold); border-color: var(--gold); color: #14140f;
}
.dabei button:focus-visible { outline: 2px solid var(--gold-tief); outline-offset: 2px; }
.dabei .anzahl { font-size: .95rem; color: var(--tinte-weich); }
.dabei .fussnote { margin: 10px 0 0; font-size: .82rem; color: var(--leise); }

/* ---------- Tabelle ---------- */
.tabellenhuelle { overflow-x: auto; }
table.tabelle { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.tabelle th { text-align: right; font-size: .74rem; font-weight: 600;
                   letter-spacing: .06em; text-transform: uppercase; color: var(--leise);
                   padding: 0 0 10px; border-bottom: 1px solid var(--linie);
                   white-space: nowrap; }
table.tabelle th.platz { text-align: left; width: 26px; }
table.tabelle th.mann { text-align: left; }
table.tabelle td { padding: 11px 0; border-bottom: 1px solid var(--linie-zart);
                   text-align: right; white-space: nowrap; }
table.tabelle td.platz { text-align: left; color: var(--leise); font-size: .86rem; }
table.tabelle td.mann { text-align: left; white-space: normal;
                        overflow-wrap: anywhere; padding-right: 12px; line-height: 1.3; }
table.tabelle td + td, table.tabelle th + th { padding-left: 12px; }
table.tabelle td.pkt { font-weight: 600; }
table.tabelle tr.wir td { background: var(--gold-schwach); font-weight: 600; }
table.tabelle tr.wir td.platz { box-shadow: inset 2px 0 0 var(--gold); }
.tabellenfuss { margin: 14px 0 0; font-size: .84rem; color: var(--leise); }
.nur-breit { display: none; }
@media (min-width: 560px) { .nur-breit { display: table-cell; } }

/* ---------- Tipp / Fuß ---------- */
.tipp { margin: 26px 0 0; padding: 16px 0 0; border-top: 1px solid var(--linie-zart);
        font-size: .9rem; color: var(--tinte-weich); }
.tipp b { font-weight: 600; color: var(--tinte); }
.fuss { margin: 46px 0 0; padding: 20px 0 46px; border-top: 1px solid var(--linie);
        font-size: .88rem; color: var(--leise); }
.fuss a { color: var(--leise); }

@media (min-width: 640px) {
  .kopf .huelle { padding: 34px 22px 40px; }
  .fakten dt { flex: 0 0 110px; }
  .knopf { display: inline-block; width: auto; min-width: 280px; }
  .wahl select { max-width: 320px; }
}

/* Meine Mannschaften: verschraenkter Blick */
#meine-inhalt .naechstes { border-top: 2px solid var(--gold); padding: 16px 0 18px;
  margin-top: 14px; }
#meine-inhalt .wann { margin: 0; font-size: .74rem; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--gold-tief); }
#meine-inhalt .wer { margin: 8px 0 0; font-size: 1.32rem; font-weight: 600;
  line-height: 1.2; letter-spacing: -.01em; }
#meine-inhalt .gegen { margin: 2px 0 0; font-size: 1.05rem; color: var(--tinte-weich); }
#meine-inhalt .dann { margin: 8px 0 0; font-size: .9rem; color: var(--leise); }
#meine-inhalt .konflikte { border: 1px solid var(--linie); border-left: 3px solid var(--niederlage);
  padding: 14px 16px; margin: 20px 0 4px; }
#meine-inhalt .konfliktkopf { margin: 0 0 8px; font-size: .74rem; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--niederlage); }
#meine-inhalt .konflikt { margin: 0; font-size: .92rem; line-height: 1.5;
  color: var(--tinte-weich); }
#meine-inhalt .konflikt + .konflikt { margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--linie-zart); }
#meine-inhalt .weitere { margin: 10px 0 0; padding-top: 10px;
  border-top: 1px solid var(--linie-zart); font-size: .85rem; color: var(--leise); }
#meine-inhalt .konflikt strong { color: var(--tinte); font-weight: 600; }
#meine-inhalt .wessen { font-size: .74rem; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--gold-tief); margin-bottom: 2px; }
/* Wie auf der Wochenend-Uebersicht: der Name deckt die ganze Zeile ab.
   Der Hallenlink liegt darueber und bleibt einzeln antippbar. */
#meine-inhalt .spiel { position: relative; }
#meine-inhalt .zurmannschaft { color: inherit; text-decoration: none; }
#meine-inhalt .zurmannschaft::after { content: ''; position: absolute; inset: 0; }
#meine-inhalt .spiel:hover .wessen { color: var(--gold); }
#meine-inhalt .spiel .halle a { position: relative; z-index: 1; }
#meine-inhalt .zurmannschaft:focus-visible { outline: 2px solid var(--gold);
                                            outline-offset: 3px; }
#meine-inhalt .spiel.stoerung { box-shadow: inset 2px 0 0 var(--niederlage);
  padding-left: 10px; margin-left: -10px; }
#meine-inhalt .leer { color: var(--leise); font-size: .95rem; margin: 18px 0 0; }
.anheftwink { margin: 12px 0 0; font-size: .82rem; line-height: 1.5;
  color: rgba(247,245,240,.62); max-width: 34em; }
.anheftwink strong { color: var(--gold); font-weight: 600; }
.tippfuss { margin: 12px 0 0; font-size: .82rem; color: var(--leise); }

.anmeldung { max-width: 380px; }
.anmeldung label { display: block; font-size: .82rem; color: var(--leise);
                   margin: 0 0 6px; }
.anmeldung input { font: inherit; width: 100%; padding: 13px 14px; margin-bottom: 16px;
                   background: transparent; color: var(--tinte);
                   border: 1px solid var(--linie); }
.anmeldung input:focus-visible { outline: 2px solid var(--gold-tief); outline-offset: 1px; }
.verlauf { margin-top: 30px; }
.verlauf .balken { fill: var(--gold); }
table.verteilung { width: 100%; border-collapse: collapse; font-size: .92rem;
                   margin-bottom: 8px; }
table.verteilung td { padding: 10px 0; border-bottom: 1px solid var(--linie-zart); }
table.verteilung td.anteil { width: 45%; padding: 10px 14px; }
table.verteilung td.anteil span { display: block; height: 8px; background: var(--gold);
                                  min-width: 1px; }
table.verteilung td.pkt { text-align: right; font-weight: 600; white-space: nowrap; }
.meldung { font-size: .9rem; color: var(--tinte-weich); }
.meldung.schlecht { color: var(--niederlage); }
#abmelden { font: inherit; font-size: .84rem; background: none; border: 0; padding: 0;
            color: var(--leise); text-decoration: underline; cursor: pointer;
            margin-top: 30px; }
</style>
</head>
<body data-worker="https://muru-zaehler.edis-herrmann.workers.dev">

<header class="kopf">
  <div class="huelle">
    <div class="marke">
      <img src="logo.png" alt="" width="149" height="200">
      <div>
        <div class="zeile1">HSG Mutterstadt/Ruchheim</div>
        <div class="zeile2">Auswertung</div>
      </div>
    </div>
    <h1>Nutzung</h1>
    <p class="saison">Letzte 30 Tage</p>
  </div>
</header>

<main class="huelle">
  <form id="anmeldung" class="anmeldung teil">
    <label for="benutzer">Benutzer</label>
    <input id="benutzer" type="email" autocomplete="username" required>
    <label for="passwort">Passwort</label>
    <input id="passwort" type="password" autocomplete="current-password" required>
    <button class="knopf" type="submit">Anmelden</button>
    <p id="meldung" class="meldung"></p>
  </form>

  <section id="auswertung" class="teil" hidden></section>
  <button id="abmelden" type="button" hidden>Abmelden</button>

  <p class="fuss">
    Die Zahlen gibt es nur nach Anmeldung.
    <a href="./">Zurück zum Spielplan</a>
  </p>
</main>

<script>
(function () {
  var worker = document.body.getAttribute('data-worker');
  var form = document.getElementById('anmeldung');
  var feldBenutzer = document.getElementById('benutzer');
  var feldPasswort = document.getElementById('passwort');
  var meldung = document.getElementById('meldung');
  var bereich = document.getElementById('auswertung');
  var abmelden = document.getElementById('abmelden');

  function zahl(n) { return (n || 0).toLocaleString('de-DE'); }

  function kennzahl(titel, wert, zusatz) {
    return '<div><dt>' + titel + '</dt><dd>' + wert +
      (zusatz ? '<span class="zusatz">' + zusatz + '</span>' : '') + '</dd></div>';
  }

  /** Balken je Tag - eine Kurve taeuscht bei laengeren Luecken Verlauf vor. */
  function verlaufsbild(tage) {
    if (!tage.length) return '';
    var hoechst = Math.max.apply(null, tage.map(function (t) { return t.aufrufe; })) || 1;
    var B = 320, H = 110, unten = 22, links = 26;
    var breite = (B - links) / tage.length;
    var balken = tage.map(function (t, i) {
      var h = Math.round((H - unten - 8) * t.aufrufe / hoechst);
      return '<rect x="' + (links + i * breite + 1).toFixed(1) + '" y="' +
        (H - unten - h) + '" width="' + Math.max(breite - 2, 1).toFixed(1) +
        '" height="' + Math.max(h, t.aufrufe ? 1 : 0) + '" class="balken"><title>' +
        t.tag + ': ' + t.aufrufe + '</title></rect>';
    }).join('');
    var erster = tage[0].tag.slice(8) + '.' + tage[0].tag.slice(5, 7) + '.';
    var letzter = tage[tage.length - 1].tag.slice(8) + '.' +
                  tage[tage.length - 1].tag.slice(5, 7) + '.';
    return '<div class="verlauf"><div class="titel">Aufrufe je Tag</div>' +
      '<svg viewBox="0 0 ' + B + ' ' + H + '" role="img" aria-label="Aufrufe je Tag">' +
      '<line class="gitter" x1="' + links + '" y1="' + (H - unten) + '" x2="' + B +
      '" y2="' + (H - unten) + '"/>' +
      '<text x="0" y="14">' + hoechst + '</text>' +
      '<text x="0" y="' + (H - unten + 4) + '">0</text>' + balken +
      '<text x="' + links + '" y="' + (H - 4) + '">' + erster + '</text>' +
      '<text x="' + B + '" y="' + (H - 4) + '" text-anchor="end">' + letzter + '</text>' +
      '</svg></div>';
  }

  function aufschluesselung(titel, werte, namen) {
    var eintraege = Object.keys(werte || {});
    if (!eintraege.length) return '';
    var summe = eintraege.reduce(function (s, k) { return s + werte[k]; }, 0) || 1;
    var zeilen = eintraege.sort(function (a, b) { return werte[b] - werte[a]; })
      .map(function (k) {
        var anteil = Math.round(100 * werte[k] / summe);
        return '<tr><td>' + (namen[k] || k) + '</td><td class="anteil">' +
          '<span style="width:' + anteil + '%"></span></td>' +
          '<td class="pkt">' + zahl(werte[k]) + '</td></tr>';
      }).join('');
    return '<div class="rubrik">' + titel + '</div><table class="verteilung"><tbody>' +
      zeilen + '</tbody></table>';
  }

  function zeige(d) {
    var e = d.gesamt.ereignis || {};
    var heute = d.verlauf.length ? d.verlauf[d.verlauf.length - 1].aufrufe : 0;
    var woche = d.verlauf.slice(-7).reduce(function (s, t) { return s + t.aufrufe; }, 0);

    bereich.innerHTML =
      '<dl class="kennzahlen">' +
        kennzahl('Aufrufe heute', zahl(heute)) +
        kennzahl('Letzte 7 Tage', zahl(woche)) +
        kennzahl('Kalender abonniert', zahl(e.abo), 'Klicks auf den Abo-Knopf') +
        kennzahl('Tipper', zahl(d.tipper), 'mit Namen eingetragen') +
      '</dl>' +
      verlaufsbild(d.verlauf) +
      aufschluesselung('Nach Mannschaft', d.gesamt.mannschaft,
        { herren1: 'Herren I', herren2: 'Herren II', damen: 'Damen' }) +
      aufschluesselung('Nach Bereich', d.gesamt.bereich,
        { kalender: 'Kalender', spiele: 'Spiele', tabelle: 'Tabelle',
          statistik: 'Statistik' }) +
      aufschluesselung('Aktionen', {
        abo: e.abo || 0, datei: e.datei || 0, grafik: e.grafik || 0,
        tipp: e.tipp || 0, hype: e.hype || 0, dabei: e.dabei || 0,
        teilen: e.teilen || 0 },
        { abo: 'Kalender abonniert', datei: 'Datei geladen', grafik: 'Bild erzeugt',
          tipp: 'Tipp abgegeben', hype: 'Angefeuert', dabei: 'Zusage',
          teilen: 'Geteilt oder kopiert' }) +
      '<p class="statfuss">Gezählt werden Summen je Tag – ohne Kennung, ohne ' +
      'Adresse, ohne Wiedererkennung. Ein Besuch meldet sich einmal beim Öffnen ' +
      'und einmal beim Verlassen.</p>';
    bereich.hidden = false;
    form.hidden = true;
    abmelden.hidden = false;
  }

  function hole(benutzer, passwort) {
    meldung.textContent = 'Wird geladen …';
    meldung.className = 'meldung';
    fetch(worker + '/auswertung', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ benutzer: benutzer, passwort: passwort, tage: 30 })
    })
      .then(function (r) {
        return r.json().then(function (d) {
          return r.ok ? d : Promise.reject(d.fehler || 'Fehler ' + r.status);
        });
      })
      .then(function (d) {
        meldung.textContent = '';
        try {
          sessionStorage.setItem('muru-admin', JSON.stringify([benutzer, passwort]));
        } catch (e) {}
        zeige(d);
      })
      .catch(function (f) {
        meldung.textContent = String(f);
        meldung.className = 'meldung schlecht';
      });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hole(feldBenutzer.value.trim(), feldPasswort.value);
  });

  abmelden.addEventListener('click', function () {
    try { sessionStorage.removeItem('muru-admin'); } catch (e) {}
    location.reload();
  });

  // Innerhalb einer Sitzung nicht jedes Mal neu anmelden
  try {
    var gemerkt = JSON.parse(sessionStorage.getItem('muru-admin') || 'null');
    if (gemerkt) hole(gemerkt[0], gemerkt[1]);
  } catch (e) {}
})();
</script>
</body>
</html>
